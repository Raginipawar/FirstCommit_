<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TRIPWIRE. Share what your meters learn, not what they see. Privacy preserving theft pattern sharing for electricity utilities."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Instrument Sans is the official companion sans to Instrument Serif,
         from the same type foundry -- a deliberate family pairing instead
         of Inter, which was never actually chosen for this project, just
         defaulted to. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      // set theme before first paint so there is no flash
      (function () {
        try {
          var saved = localStorage.getItem('tripwire-theme')
          var system = window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark'
          document.documentElement.dataset.theme = saved || system
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <title>TRIPWIRE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
